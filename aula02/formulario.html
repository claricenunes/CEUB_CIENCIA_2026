<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escola Virtual</title>
</head>
<body>

    <h1>Escola Virtual</h1>
    <h2>Formulário de Pré-Matrícula</h2>

    <form>
        <h3>Dados Pessoais</h3>

        <label for="nomeAluno">Nome do aluno</label>
        <input type="text" id="nomeAluno" name="nomeAluno">

        <label for="dataNasc">Data de nascimento</label>
        <input type="text" id="dataNasc" name="dataNasc">

        <label for="nomeMae">Nome da mãe</label>
        <input type="text" id="nomeMae" name="nomeMae">

        <label for="nomePai">Nome do pai</label>
        <input type="text" id="nomePai" name="nomePai">

        <label for="telefone">Telefone</label>
        <input type="text" id="telefone" name="telefone">

        <label for="email">Email</label>
        <input type="text" id="email" name="email">

        <h3>Informações de Matrícula</h3>

        <label for="serie">Série</label>
        <input type="text" id="serie" name="serie">

        <label for="turma">Turma</label>
        <input type="text" id="turma" name="turma">

        <label for="turno">Turno</label>
        <select id="turno" name="turno">
            <option value="matutino">Matutino</option>
            <option value="vespertino">Vespertino</option>
            <option value="noturno">Noturno</option>
        </select>

        <label for="atividadesExtra">Atividades extracurriculares</label>
        <input type="text" id="atividadesExtra" name="atividadesExtra">

        <label for="observacoes">Observações</label>
        <textarea id="observacoes" name="observacoes"></textarea>

        <input type="submit" value="Enviar formulário">
        <input type="reset" value="Limpar">
    </form>

</body>
</html>
