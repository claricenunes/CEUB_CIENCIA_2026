<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escola Virtual</title>
</head>
<body>

    <h1>Escola Virtual</h1>
    <h2>Formulário de Pré-Matrícula</h2>

    <form>
        <h3>Dados Pessoais</h3>

        <label for="nomeAluno">Nome do aluno</label><br>
        <input type="text" id="nomeAluno" name="nomeAluno"><br><br>

        <label for="nomeMae">Nome da mãe</label><br>
        <input type="text" id="nomeMae" name="nomeMae"><br><br>

        <label for="nomePai">Nome do pai</label><br>
        <input type="text" id="nomePai" name="nomePai"><br><br>

        <h3>Informações de Matrícula</h3>

        <label for="serie">Série</label><br>
        <input type="text" id="serie" name="serie"><br><br>

        <label for="turno">Turno</label><br>
        <select id="turno" name="turno">
            <option value="matutino">Matutino</option>
            <option value="vespertino">Vespertino</option>
            <option value="noturno">Noturno</option>
        </select><br><br>

        <label for="escolaOrigem">Escola de origem</label><br>
        <input type="text" id="escolaOrigem" name="escolaOrigem"><br><br>

        <label for="observacoes">Observações</label><br>
        <textarea id="observacoes" name="observacoes" rows="4" cols="30"></textarea><br><br>

        <input type="submit" value="Enviar">
    </form>

</body>
</html>
